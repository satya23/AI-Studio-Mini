openapi: 3.0.3
info:
  title: AI Studio Mini API
  description: API for AI image generation with user authentication
  version: 1.0.0
servers:
  - url: http://localhost:5050
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /auth/signup:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)'
                  example: Password123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User with this email already exists

  /auth/login:
    post:
      summary: Authenticate user and get access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: Password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation error
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid email or password

  /generations:
    post:
      summary: Create a new image generation request
      tags:
        - Generations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - prompt
                - style
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: A beautiful sunset over mountains
                style:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: realistic
                imageUpload:
                  type: string
                  description: Optional image upload URL or base64
                  example: https://example.com/image.jpg
      responses:
        '201':
          description: Generation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  imageUrl:
                    type: string
                    format: uri
                  prompt:
                    type: string
                  style:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum:
                      - pending
                      - completed
                      - failed
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Validation error
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Access token required
        '403':
          description: Forbidden - Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid or expired token
        '503':
          description: Service unavailable - Model overloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Model overloaded

    get:
      summary: Get generations for the authenticated user
      tags:
        - Generations
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of generations to return (default: 5)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
            example: 5
      responses:
        '200':
          description: Generations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Generations retrieved successfully
                  generations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        userId:
                          type: string
                        prompt:
                          type: string
                        style:
                          type: string
                        imageUrl:
                          type: string
                          format: uri
                        status:
                          type: string
                          enum:
                            - pending
                            - completed
                            - failed
                        createdAt:
                          type: string
                          format: date-time
                  count:
                    type: integer
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid limit parameter
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Access token required
        '403':
          description: Forbidden - Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid or expired token

  /health:
    get:
      summary: Health check endpoint
      tags:
        - System
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: AI Studio Mini API is running

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login endpoint

