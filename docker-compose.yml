version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=development
      - PORT=5050
      - JWT_SECRET=your-secret-key-change-in-production
      - DATABASE_PATH=./data/database.db
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    depends_on:
      - db
    networks:
      - ai-studio-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5050
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ai-studio-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ai_studio
      - POSTGRES_PASSWORD=ai_studio_password
      - POSTGRES_DB=ai_studio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-studio-network

volumes:
  postgres_data:

networks:
  ai-studio-network:
    driver: bridge

